name: Publish package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write # Required by GH to obtain OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
      - name: Upgrade to npm version required for staged publishing (npm 11.15+)
        run: npm install -g npm@12.0.2
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
      - name: Publish to registry
        run: npm stage publish --provenance
